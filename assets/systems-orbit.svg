<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Amogh's engineering system map</title>
  <desc id="desc">Four animated domains orbit a proof-first engineering core: Earth observation, privacy, governed AI and product systems.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".8"/>
      <stop offset=".45" stop-color="#0ea5e9" stop-opacity=".25"/>
      <stop offset="1" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#030b1d"/>
      <stop offset=".55" stop-color="#07152c"/>
      <stop offset="1" stop-color="#03121c"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .orbit { fill:none; stroke:#38bdf8; stroke-opacity:.18; stroke-width:1.5; stroke-dasharray:7 12; animation:dash 18s linear infinite; }
    .orbit.alt { stroke:#2dd4bf; animation-direction:reverse; animation-duration:24s; }
    .packet { filter:url(#glow); }
    .node { animation:float 4s ease-in-out infinite; }
    .n2 { animation-delay:-1s; }.n3 { animation-delay:-2s;}.n4 { animation-delay:-3s;}
    .core-ring { transform-origin:600px 195px; animation:spin 18s linear infinite; }
    @keyframes dash { to { stroke-dashoffset:-190; } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-7px); } }
    @media (prefers-reduced-motion: reduce) { .orbit,.node,.core-ring { animation:none; } }
  </style>
  <rect width="1200" height="390" rx="22" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="388" rx="21" fill="none" stroke="#334155"/>
  <ellipse class="orbit" cx="600" cy="195" rx="430" ry="132"/>
  <ellipse class="orbit alt" cx="600" cy="195" rx="300" ry="166"/>
  <path id="track" d="M170 195C210 35 990 35 1030 195S210 355 170 195Z" fill="none"/>
  <path id="track2" d="M300 195C330 345 870 345 900 195S330 45 300 195Z" fill="none"/>
  <circle class="packet" r="5" fill="#38bdf8"><animateMotion dur="8s" repeatCount="indefinite"><mpath href="#track"/></animateMotion></circle>
  <circle class="packet" r="4" fill="#2dd4bf"><animateMotion dur="10s" begin="-4s" repeatCount="indefinite"><mpath href="#track"/></animateMotion></circle>
  <circle class="packet" r="4" fill="#818cf8"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#track2"/></animateMotion></circle>
  <circle cx="600" cy="195" r="106" fill="url(#core)"/>
  <g class="core-ring" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round">
    <path d="M600 86A109 109 0 0 1 701 154" stroke-dasharray="42 18"/>
    <path d="M600 304A109 109 0 0 1 499 236" stroke="#2dd4bf" stroke-dasharray="32 24"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="600" y="179" fill="#7dd3fc" font-size="13" font-weight="700" letter-spacing="4">ENGINEERING CORE</text>
    <text x="600" y="211" fill="#f8fafc" font-size="24" font-weight="750">BUILD · VERIFY · SHIP</text>
    <text x="600" y="239" fill="#94a3b8" font-size="13" letter-spacing="2">TRUTH BEFORE THEATRE</text>
    <g class="node n1">
      <rect x="55" y="126" width="250" height="102" rx="18" fill="#071a35" stroke="#2563eb"/>
      <circle cx="92" cy="158" r="12" fill="#2563eb" opacity=".26"/><circle cx="92" cy="158" r="5" fill="#60a5fa"/>
      <text x="180" y="165" fill="#f8fafc" font-size="18" font-weight="700">EARTH OBSERVATION</text>
      <text x="180" y="194" fill="#94a3b8" font-size="13">metric DSM · terrain · validation</text>
    </g>
    <g class="node n2">
      <rect x="895" y="126" width="250" height="102" rx="18" fill="#071a35" stroke="#0ea5e9"/>
      <circle cx="932" cy="158" r="12" fill="#0ea5e9" opacity=".22"/><circle cx="932" cy="158" r="5" fill="#38bdf8"/>
      <text x="1020" y="165" fill="#f8fafc" font-size="18" font-weight="700">PRIVACY SYSTEMS</text>
      <text x="1020" y="194" fill="#94a3b8" font-size="13">identity graphs · red teams · proof</text>
    </g>
    <g class="node n3">
      <rect x="188" y="266" width="270" height="82" rx="18" fill="#071a35" stroke="#2dd4bf"/>
      <text x="323" y="303" fill="#f8fafc" font-size="18" font-weight="700">GOVERNED AI</text>
      <text x="323" y="328" fill="#94a3b8" font-size="13">policy · approval · rollback</text>
    </g>
    <g class="node n4">
      <rect x="742" y="266" width="270" height="82" rx="18" fill="#071a35" stroke="#818cf8"/>
      <text x="877" y="303" fill="#f8fafc" font-size="18" font-weight="700">PRODUCT SYSTEMS</text>
      <text x="877" y="328" fill="#94a3b8" font-size="13">frontend · backend · release</text>
    </g>
  </g>
</svg>
